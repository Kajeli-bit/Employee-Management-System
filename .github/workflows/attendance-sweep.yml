name: Attendance sweep

# Runs the automatic clock-out check so forgotten clock-outs close on days when
# nobody has the employee app open. The endpoint is idempotent, so a frequent
# schedule costs nothing and a delayed run still records the right close time.
#
# Setup:
#   Repository variable  ATTENDANCE_SWEEP_URL   https://<your-domain>/api/cron/attendance
#   Repository secret    ATTENDANCE_CRON_SECRET same value as CRON_SECRET on the server
# Without both, the job exits without doing anything.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: attendance-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Run the automatic clock-out check
        env:
          SWEEP_URL: ${{ vars.ATTENDANCE_SWEEP_URL }}
          CRON_SECRET: ${{ secrets.ATTENDANCE_CRON_SECRET }}
        run: |
          set -eu

          if [ -z "$CRON_SECRET" ]; then
            echo "ATTENDANCE_CRON_SECRET repository secret is not set."
            exit 1
          fi

          if [ -z "$SWEEP_URL" ]; then
            echo "ATTENDANCE_SWEEP_URL repository variable is not set."
            exit 1
          fi

          case "$SWEEP_URL" in
            https://*) ;;
            *) echo "ATTENDANCE_SWEEP_URL must use HTTPS."; exit 1 ;;
          esac

          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-connrefused --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SWEEP_URL"
